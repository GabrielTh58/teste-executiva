services:
  db:
    image: postgres:16-alpine
    container_name: executiva-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-executiva_db}"]      
      interval: 5s
      timeout: 5s
      retries: 5

