services:
  db:
    image: postgres:16-alpine
    container_name: executiva-db
    env_file:
      - .env
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-admin} -d ${POSTGRES_DB:-executiva_db}"]      
      interval: 5s
      timeout: 5s
      retries: 5

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: executiva-backend
    ports:
      - "4000:4000"
    env_file:
      - .env
    depends_on:
      db:
        condition: service_healthy
    command: sh -c "npx prisma migrate deploy && npx prisma db seed && npm run start:prod"
    healthcheck:
        test: ["CMD-SHELL", "wget -qO- http://localhost:4000/health || exit 1"]
        interval: 10s
        timeout: 5s
        retries: 8
        start_period: 15s    

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: executiva-frontend    
    ports:
      - "3000:3000"
    env_file:
      - .env
    depends_on:
      backend:
        condition: service_healthy

volumes:
  postgres_data: